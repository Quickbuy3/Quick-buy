<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Create Account — Quick Buy</title>
<meta name="description" content="Register a free Quick Buy account for faster checkout and order tracking." />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="register">
<div id="header-slot"></div>
<main class="container">
  <h1 class="page-title">Create your account</h1>
  <form class="panel" id="registerForm">
    <div class="field"><label for="rgName">Full name</label><input id="rgName" required placeholder="John Doe" /></div>
    <div class="field"><label for="rgEmail">Email</label><input id="rgEmail" type="email" required placeholder="you@example.com" /></div>
    <div class="field"><label for="rgPass">Password</label><input id="rgPass" type="password" required placeholder="Minimum 6 characters" /></div>
    <button class="btn block lg" type="submit">Register</button>
    <p class="muted center" style="margin-top:14px">Already have an account? <a href="login.html" style="color:var(--orange);font-weight:700">Login</a></p>
  </form>
</main>
<div id="nav-slot"></div>
<script src="script.js"></script>
<script>mountChrome("account"); initRegister();</script>
</body>
</html>
