<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Account — Quick Buy</title>
<meta name="description" content="Manage your Quick Buy profile, orders, wishlist and app preferences." />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="profile">
<div id="header-slot"></div>
<main class="container">
  <h1 class="page-title">My Account</h1>
  <div id="profileBox"></div>
  <div id="profileStats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px"></div>

  <div class="menu-list">
    <a href="orders.html">📦 My Orders <span class="arrow">›</span></a>
    <a href="wishlist.html">❤️ My Wishlist <span class="arrow">›</span></a>
    <a href="cart.html">🛒 My Cart <span class="arrow">›</span></a>
    <a href="categories.html">🗂️ Browse Categories <span class="arrow">›</span></a>
    <button data-theme-icon-wrap onclick="toggleTheme()">🌗 Dark Mode <span class="arrow">Toggle</span></button>
    <button id="logoutBtn" onclick="logout()" style="color:var(--red);display:none">🚪 Logout <span class="arrow">›</span></button>
  </div>
  <p class="muted center" style="margin:22px 0">Quick Buy v2.0 · Made with ❤️</p>
</main>
<div id="nav-slot"></div>
<script src="script.js"></script>
<script>mountChrome("account"); renderProfile();</script>
</body>
</html>
