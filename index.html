<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Buy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🛒 Quick Buy</h1>
  <p>Everything you need, delivered fast</p>
  <a href="cart.html" style="color:white;">🛒 Cart</a>
</header>

<div class="search">
  <input type="text" placeholder="Search products...">
</div>

<section>
<h2>Categories</h2>
<div class="cards">
  <div class="card">📱 Electronics</div>
  <div class="card">👕 Fashion</div>
  <div class="card">🏠 Home</div>
  <div class="card">🛒 Grocery</div>
</div>
</section>

<section>
<h2>Featured Products</h2>

<div class="products">

<div class="product">
  <img src="https://via.placeholder.com/250" alt="Smart Phone">
  <h3>Smart Phone</h3>
  <p>⭐ 4.5 Rating</p>
  <p>₹9999</p>
  <button onclick="addToCart('Smart Phone')">Add to Cart</button>
</div>

<div class="product">
  <img src="https://via.placeholder.com/250" alt="Wireless Headphones">
  <h3>Wireless Headphones</h3>
  <p>⭐ 4.2 Rating</p>
  <p>₹1499</p>
  <button onclick="addToCart('Wireless Headphones')">Add to Cart</button>
</div>

<div class="product">
  <img src="https://via.placeholder.com/250" alt="Smart Watch">
  <h3>Smart Watch</h3>
  <p>⭐ 4.6 Rating</p>
  <p>₹1999</p>
  <button onclick="addToCart('Smart Watch')">Add to Cart</button>
</div>

</div>

</section>

<script src="script.js"></script>

</body>
</html>
