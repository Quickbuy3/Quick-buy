<!DOCTYPE html>
<html lang="en">
<head>

<title>Quick Buy</title>
<link rel="stylesheet" href="style.css">

<body>

<div class="search">

    type="text"
    id="search"
    placeholder="🔍 Search products..."

<div class="cards">

</div>

</section>

<section>
