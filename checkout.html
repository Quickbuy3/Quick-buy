<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Quick Buy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🛒 Checkout</h1>
<a href="cart.html" style="color:white;text-decoration:none;">⬅ Back to Cart</a>
</header>

<section>

<div class="product">

<h2>Delivery Details</h2>

<input type="text" id="name" placeholder="Full Name"><br><br>

<input type="tel" id="mobile" placeholder="Mobile Number"><br><br>

<textarea id="address" placeholder="Full Address"></textarea><br><br>

<input type="text" id="pincode" placeholder="Pincode"><br><br>

<input type="text" id="city" placeholder="City"><br><br>

<input type="text" id="state" placeholder="State"><br><br>

<h3>Payment Method</h3>

<label>
<input type="radio" name="payment" checked>
Cash on Delivery (COD)
</label>

<br><br>

<div id="orderSummary" class="cart-summary">
<h3>Order Summary</h3>
<p id="totalItems"></p>
<p id="totalAmount"></p>
</div>

<br>

<button onclick="placeOrder()">Place Order</button>

</div>

</section>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let totalItems = cart.reduce((t, i) => t + i.qty, 0);
let totalAmount = cart.reduce((t, i) => t + (i.price * i.qty), 0);

window.onload = function () {
  document.getElementById("totalItems").innerHTML =
    "Items: " + totalItems;

  document.getElementById("totalAmount").innerHTML =
    "<b>Total: ₹" + totalAmount + "</b>";
}

function placeOrder(){

let name=document.getElementById("name").value;
let mobile=document.getElementById("mobile").value;
let address=document.getElementById("address").value;
let pincode=document.getElementById("pincode").value;
let city=document.getElementById("city").value;
let state=document.getElementById("state").value;

if(
name==="" ||
mobile==="" ||
address==="" ||
pincode==="" ||
city==="" ||
state===""){
alert("Please fill all details.");
return;
}

alert("🎉 Order Placed Successfully!");

localStorage.removeItem("cart");

window.location.href="index.html";

}

</script>

</body>
</html>
