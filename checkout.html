<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Checkout — Quick Buy</title>
<meta name="description" content="Enter your delivery details and place your Quick Buy order securely." />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="checkout">
<div id="header-slot"></div>
<main class="container" id="checkoutBody">
  <h1 class="page-title">Checkout</h1>
  <div id="checkoutSummary"></div>
  <form class="panel" id="checkoutForm" style="margin-top:14px">
    <div class="field"><label for="coName">Full name</label><input id="coName" required placeholder="John Doe" /></div>
    <div class="field"><label for="coEmail">Email</label><input id="coEmail" type="email" required placeholder="you@example.com" /></div>
    <div class="field"><label for="coPhone">Phone</label><input id="coPhone" type="tel" required pattern="[0-9]{10}" placeholder="10-digit mobile number" /></div>
    <div class="field"><label for="coAddress">Delivery address</label><textarea id="coAddress" rows="3" required placeholder="House no, street, city, PIN"></textarea></div>
    <div class="field"><label for="coPayment">Payment method</label>
      <select id="coPayment">
        <option>Cash on Delivery</option>
        <option>UPI</option>
        <option>Credit / Debit Card</option>
        <option>Net Banking</option>
      </select>
    </div>
    <button class="btn block lg" type="submit">Place Order</button>
  </form>
</main>
<div id="nav-slot"></div>
<script src="script.js"></script>
<script>mountChrome("cart"); renderCheckout();</script>
</body>
</html>
