<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Login — Quick Buy</title>
<meta name="description" content="Login to your Quick Buy account to track orders and access your wishlist." />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">
<div id="header-slot"></div>
<main class="container">
  <h1 class="page-title">Welcome back</h1>
  <form class="panel" id="loginForm">
    <div class="field"><label for="lgEmail">Email</label><input id="lgEmail" type="email" required placeholder="you@example.com" /></div>
    <div class="field"><label for="lgPass">Password</label><input id="lgPass" type="password" required placeholder="••••••" /></div>
    <button class="btn block lg" type="submit">Login</button>
    <p class="muted center" style="margin-top:14px">New to Quick Buy? <a href="register.html" style="color:var(--orange);font-weight:700">Create an account</a></p>
  </form>
</main>
<div id="nav-slot"></div>
<script src="script.js"></script>
<script>mountChrome("account"); initLogin();</script>
</body>
</html>
