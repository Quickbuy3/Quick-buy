<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Quick Buy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🔐 Login</h1>
<a href="index.html" style="color:white;text-decoration:none;">⬅ Home</a>
</header>

<section>

<div class="product">

<h2>Welcome Back</h2>

<input type="email" id="email" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;">

<input type="password" id="password" placeholder="Password" style="width:100%;padding:12px;margin:10px 0;">

<button onclick="login()">Login</button>

<p style="margin-top:20px;">
Don't have an account?
<a href="register.html">Register</a>
</p>

</div>

</section>

<script>

function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

if(email==="" || password===""){
alert("Please fill all fields.");
return;
}

alert("✅ Login Successful");

window.location.href="index.html";

}

</script>

</body>
</html>
